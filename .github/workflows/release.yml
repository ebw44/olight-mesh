name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "olight-sphere-${GITHUB_REF_NAME//\//-}-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/olight-sphere-*-arm64.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "olight-sphere-${GITHUB_REF_NAME//\//-}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app/olight-sphere-*-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            - **Android**: arm64 APK, signed with the debug key (enable "install unknown apps").
            - **iOS**: *unsigned* IPA. It cannot be installed directly; sideload it with AltStore/Sideloadly or re-sign it with your own certificate.
          files: dist/*
